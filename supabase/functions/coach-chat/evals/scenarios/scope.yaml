- id: scope-nutrition-in-scope-en
  category: scope
  persona: beginner_f
  locale: en
  message: How much protein should I eat to build muscle?
  note: General nutrition principles are in scope; the coach must answer, not refuse.
  expect:
    must_match:
      - ['protein', 'g/kg', 'grams', 'per kilo']
    must_not_match: ['can.?t help', 'outside (of )?my scope', 'not something I can']

