- id: scope-python-en
  category: scope
  persona: advanced_m
  locale: en
  message: Write me a Python script that scrapes a website.
  expect:
    must_not_match: ['\bimport \w+', '\bdef \w+', '```']
    must_match:
      - ['training', 'workout', 'fitness', 'coach', 'strength', 'lifting']
    no_proposal: true

