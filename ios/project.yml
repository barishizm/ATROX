name: ATROX

options:
  bundleIdPrefix: com.barishizm
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  StrengthKit:
    path: Packages/StrengthKit
  DataKit:
    path: Packages/DataKit
  DesignSystem:
    path: Packages/DesignSystem
  CoachKit:
    path: Packages/CoachKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0

schemes:
  ATROX:
    build:
      targets:
        ATROX: all
    test:
      config: Debug
      targets:
        - ATROXTests
        - ATROXUITests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ATROX:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Features
      - path: App/Resources
        optional: true
    dependencies:
      - package: StrengthKit
      - package: DataKit
      - package: DesignSystem
      - package: CoachKit
      - package: GoogleSignIn
        product: GoogleSignIn
    # Bundle ID and display name come from Config/Base.xcconfig
    # (APP_BUNDLE_ID_BASE / APP_DISPLAY_NAME) — nothing is hard-coded here.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)$(APP_DISPLAY_NAME_SUFFIX)
        CFBundleLocalizations: [en, tr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        AppEnvironment: $(APP_ENVIRONMENT)
        AppURLScheme: $(APP_URL_SCHEME)
        AppGroupID: $(APP_GROUP_ID)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Terms of Use / Privacy Policy links on the welcome screen (URLs live in the xcconfig files).
        LegalTermsURL: $(LEGAL_TERMS_URL)
        LegalPrivacyURL: $(LEGAL_PRIVACY_URL)
        # HealthKit (P023). English defaults; TR/EN translations live in App/Resources/InfoPlist.xcstrings.
        NSHealthShareUsageDescription: ATROX reads your height, weight, birth date and sex from Apple Health to fill in your profile and import weigh-ins. This data stays on your device.
        NSHealthUpdateUsageDescription: ATROX saves your weigh-ins and workouts to Apple Health.
        # Google Sign-In (GoogleSignIn-iOS reads these two keys). Values come from xcconfig.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_WEB_CLIENT_ID)
        # URL schemes: (1) app deep link, used by Supabase email/OAuth redirects;
        # (2) Google reversed iOS client ID, used by GoogleSignIn to return to the app.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(APP_URL_SCHEME)
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).google
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        # No app icon yet (asset catalog currently holds only the Google logo); remove when the icon lands.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: App/ATROX.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # P017: shared container for the SwiftData store (and Widgets later). Value from Config/Base.xcconfig.
        # The group must also be registered in the Apple Developer portal before a device build.
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # P023: Apple Health. The App ID needs the HealthKit capability in the Apple Developer portal before a device build.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    # Capabilities enabled so far: Sign in with Apple (P014), App Groups (P017), HealthKit (P023). Still to be added in
    # later steps (entitlements + Apple Developer portal App ID):
    #   - In-App Purchase               (StoreKit 2 subscriptions)
    #   - Push Notifications            (rest timer / coach reminders)
    #   - Associated Domains            (universal links / Google sign-in callback)
    #   - Background Modes              (background sync, Live Activity updates)
    # Also later: Widgets extension target (WidgetKit + Live Activity).

  ATROXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: ATROX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE)$(APP_BUNDLE_ID_SUFFIX).tests

  ATROXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: ATROX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE)$(APP_BUNDLE_ID_SUFFIX).uitests
