name: GymAnalyzer

options:
  bundleIdPrefix: com.barishizm
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  StrengthKit:
    path: Packages/StrengthKit
  DataKit:
    path: Packages/DataKit
  DesignSystem:
    path: Packages/DesignSystem
  CoachKit:
    path: Packages/CoachKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0

schemes:
  GymAnalyzer:
    build:
      targets:
        GymAnalyzer: all
    test:
      config: Debug
      targets:
        - GymAnalyzerTests
        - GymAnalyzerUITests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  GymAnalyzer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Features
      - path: App/Resources
        optional: true
    dependencies:
      - package: StrengthKit
      - package: DataKit
      - package: DesignSystem
      - package: CoachKit
      - package: GoogleSignIn
        product: GoogleSignIn
    # Bundle ID and display name come from Config/Base.xcconfig
    # (APP_BUNDLE_ID_BASE / APP_DISPLAY_NAME) — nothing is hard-coded here.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)$(APP_DISPLAY_NAME_SUFFIX)
        CFBundleLocalizations: [en, tr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        AppEnvironment: $(APP_ENVIRONMENT)
        AppURLScheme: $(APP_URL_SCHEME)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Terms of Use / Privacy Policy links on the welcome screen (URLs live in the xcconfig files).
        LegalTermsURL: $(LEGAL_TERMS_URL)
        LegalPrivacyURL: $(LEGAL_PRIVACY_URL)
        # Google Sign-In (GoogleSignIn-iOS reads these two keys). Values come from xcconfig.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_WEB_CLIENT_ID)
        # URL schemes: (1) app deep link, used by Supabase email/OAuth redirects;
        # (2) Google reversed iOS client ID, used by GoogleSignIn to return to the app.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(APP_URL_SCHEME)
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).google
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    entitlements:
      path: App/GymAnalyzer.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    # Capabilities enabled so far: Sign in with Apple (P014). Still to be added in later steps
    # (entitlements + Apple Developer portal App ID):
    #   - HealthKit                     (body weight / workout import)
    #   - In-App Purchase               (StoreKit 2 subscriptions)
    #   - Push Notifications            (rest timer / coach reminders)
    #   - App Groups                    (share data with Widgets target)
    #   - Associated Domains            (universal links / Google sign-in callback)
    #   - Background Modes              (background sync, Live Activity updates)
    # Also later: Widgets extension target (WidgetKit + Live Activity).

  GymAnalyzerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: GymAnalyzer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE)$(APP_BUNDLE_ID_SUFFIX).tests

  GymAnalyzerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: GymAnalyzer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE)$(APP_BUNDLE_ID_SUFFIX).uitests
