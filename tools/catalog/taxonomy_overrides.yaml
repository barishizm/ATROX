overrides:
  dips-chest-version:
    movement_pattern: vertical_push
    still_unsure: true
    note: "Dips load chest and triceps together; filed under vertical push (hands travel past the torso). Confirm."
  dips-triceps-version:
    movement_pattern: vertical_push
    still_unsure: true
    note: "Same movement as the chest version with a more upright torso; filed under vertical push. Confirm."
  parallel-bar-dip:
    movement_pattern: vertical_push
    still_unsure: true
    note: "Same dip family as above. Confirm."
  dip-machine:
    movement_pattern: vertical_push
    note: "Machine dip; pattern follows the free dip."
  straight-arm-pulldown:
    movement_pattern: isolation_back
    note: "Straight-arm pulldown is a lat isolation, not a vertical pull."
  farmers-walk:
    load_convention: per_hand
    note: "Farmer's walk is loaded per hand."
  hyperextensions-back-extensions:
    scoring_type: bodyweight_loaded
    load_convention: bodyweight_plus
    note: "Done with body weight, optionally holding a plate."
  barbell-ab-rollout:
    scoring_type: reps_only
    load_convention: null
    note: "Rollout is bodyweight; the barbell is only the roller."
  trap-bar-deadlift:
    note: "Trap bar counts as total load including the bar."
  goblet-squat:
    note: "Single implement; total load equals the one kettlebell/dumbbell."
  one-arm-kettlebell-swings:
    note: "Single implement; total load equals the one kettlebell."
  t-bar-row-with-handle:
    note: "Landmine-style T-bar row; total load including the bar."
  butterfly:
    note: "Pec deck / butterfly machine; chest isolation."
  bent-over-low-pulley-side-lateral:
    note: "Rear/lateral delt isolation on a low pulley."
  face-pull:
    note: "Filed as shoulder isolation (rear delt / external rotation emphasis)."
  donkey-calf-raises:
    note: "Loaded with a partner or belt; total load."
