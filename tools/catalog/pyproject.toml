[project]
name = "atrox-catalog"
version = "0.1.0"
description = "free-exercise-db import pipeline for the ATROX exercise catalog"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
catalog-import = "catalog.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
