# Anchor ratios and load rules for the core exercises (P056, docs/03-ML-MODEL.md §6).
#
# Read by `uv run catalog-taxonomy`, which copies the values into scoring_taxonomy.yaml. Edit here, then regenerate.
#
# Units: `ratio` (ρ) relates the e1RM of the number the user TYPES for this exercise (its load_convention) to the
# 1RM of the anchor lift:  e1RM_logged ≈ ρ · e1RM_anchor.
#   total            whole implement incl. the bar (Smith machine: incl. the Smith bar, whatever it weighs)
#   per_hand         one dumbbell / kettlebell (the user types 30 for a pair of 30s)
#   per_side         plates on one side of a plate-loaded machine (sled/carriage weight unknown → not added)
#   machine_stack    the number on the stack or plate-loaded lever machine
#   bodyweight_plus  effective load = bw_fraction · body weight + added load (assistance band: not subtracted)
#
# tau (§6): log-scale spread of the ratio between people. Unless a row overrides it, tau comes from the grade:
#   anchor lift itself → tau_anchor, A → 0.08, B → 0.15, C → 0.40, and any machine/cable row → tau_machine.
#   Scale: OpenPowerlifting gives a between-person SD of log(bench/squat) ≈ 0.15 and log(deadlift/squat) ≈ 0.12–0.14
#   (source `opl`), so 0.08 is "close variant of the anchor" and 0.40 is "we only know the order of magnitude".
#   tau_c_min is the floor the tests enforce for grade C so that a C exercise can never give an extreme score (§6):
#   with the largest within-cell SD of log 1RM seen in OPL (s_max), |z_anchor| = 3 maps to a score inside [5, 95].
#
# Grades (ratio_confidence): A = two or more agreeing primary sources (or the anchor itself), B = one primary source
# or a product of A/B sources, C = expert estimate. Machines and cables are capped at C (brand/pulley differences).
tau:
  anchor: 0.02
  A: 0.08
  B: 0.15
  C: 0.40
  machine: 0.50
consistency:
  s_max: 0.25          # ≥ largest robust/raw within-cell SD of log 1RM in OPL (M: 0.19–0.23, F: 0.23–0.26 → see opl)
  z_extreme: 3.0
  score_bounds: [5, 95]

sources:
  anchor:
    cite: "Definition — the anchor lift itself (docs/03-ML-MODEL.md §4)."
  opl:
    cite: >-
      OpenPowerlifting snapshot 2026-11-07 (ml/data/SOURCES.md), computed in P056: first raw SBD meet per athlete,
      286,293 men / 133,646 women. Median bench/squat 0.667 M, 0.556 F; deadlift/squat 1.178 M, 1.227 F;
      robust SD of log ratios 0.12–0.17. Residual SD of log 1RM given sex, body weight and age 0.19–0.26.
    url: https://openpowerlifting.gitlab.io/opl-csv/
    accessed: 2026-11-13
  saeterbakken2011:
    cite: >-
      Saeterbakken AH, van den Tillaar R, Fimland MS. A comparison of muscle activity and 1-RM strength of three
      chest-press exercises with different stability requirements. J Sports Sci 2011;29(5):533-8.
      Dumbbell 1RM (sum of both) 17% below barbell; Smith machine 3% below barbell (12 trained men).
    url: https://doi.org/10.1080/02640414.2010.543916
    accessed: 2026-11-13
  saeterbakken2013:
    cite: >-
      Saeterbakken AH, Fimland MS. Effects of body position and loading modality on muscle activity and strength in
      shoulder presses. J Strength Cond Res 2013;27(7):1824-31. Standing dumbbell 1RM ~7% below standing barbell
      and ~10% below seated dumbbell (15 men).
    url: https://doi.org/10.1519/JSC.0b013e318276b873
    accessed: 2026-11-13
  cotterman2005:
    cite: >-
      Cotterman ML, Darby LA, Skelly WA. Comparison of muscle force production using the Smith machine and free
      weights for bench press and squat exercises. J Strength Cond Res 2005;19(1):169-76.
      Smith bench 1RM = −6.76 + 0.95 × free bench 1RM; Smith squat 1RM ≥ free squat (16 men, 16 women).
    url: https://doi.org/10.1519/14433.1
    accessed: 2026-11-13
  swinton2011:
    cite: >-
      Swinton PA et al. A biomechanical analysis of straight and hexagonal barbell deadlifts using submaximal loads.
      J Strength Cond Res 2011;25(7):2000-9. Hexagonal bar 1RM 265 ± 41 kg vs straight bar 245 ± 39 kg (19 men).
    url: https://doi.org/10.1519/JSC.0b013e3181e73f87
    accessed: 2026-11-13
  lockie2018:
    cite: >-
      Lockie RG et al. The 1 repetition maximum mechanics of a high-handle hexagonal bar deadlift compared with a
      conventional deadlift as measured by a linear position transducer. J Strength Cond Res 2018;32(1):150-161.
      High-handle hex bar 154.5 ± 45.3 kg vs conventional 134.7 ± 40.6 kg (21 men, 10 women).
    url: https://doi.org/10.1519/JSC.0000000000001781
    accessed: 2026-11-13
  rodriguezridao2020:
    cite: >-
      Rodríguez-Ridao D et al. Effect of five bench inclinations on the electromyographic activity of the pectoralis
      major, anterior deltoid, and triceps brachii during the bench press exercise. Int J Environ Res Public Health
      2020;17(19):7339, Table 1. 1RM 81.4 kg at 0°, 63.3 kg at 30°, 57.9 kg at 45° (30 trained adults).
    url: https://doi.org/10.3390/ijerph17197339
    accessed: 2026-11-13
  larsen2021:
    cite: >-
      Larsen S, Gomo O, van den Tillaar R. A biomechanical analysis of wide, medium, and narrow grip width effects on
      ... 1-RM bench pressing. Front Sports Act Living 2021;2:637066. 1RM wide 109.8, medium 108.9, narrow 103.7 kg.
    url: https://doi.org/10.3389/fspor.2020.637066
    accessed: 2026-11-13
  suprak2011:
    cite: >-
      Suprak DN, Dawes J, Stephenson MD. The effect of position on the percentage of body mass supported during
      traditional and modified push-up variants. J Strength Cond Res 2011;25(2):497-503. Traditional push-up
      69.16% (up) / 75.04% (down) of body mass — values as reported by the Cooper Institute summary.
    url: https://doi.org/10.1519/JSC.0b013e3181bde2cf
    accessed: 2026-11-13
  ebben2011:
    cite: >-
      Ebben WP et al. Kinetic analysis of several variations of push-ups. J Strength Cond Res 2011;25(10):2891-4.
      Peak GRF as share of body mass: regular ≈ 0.64–0.66, feet on 30.5 cm box ≈ 0.70, on 61 cm box ≈ 0.74
      (values from secondary summaries; the abstract states the ordering only).
    url: https://doi.org/10.1519/JSC.0b013e31820c8587
    accessed: 2026-11-13
  deleva1996:
    cite: >-
      de Leva P. Adjustments to Zatsiorsky-Seluyanov's segment inertia parameters. J Biomech 1996;29(9):1223-30.
      Segment mass shares (male/female %): head 6.94/6.68, trunk 43.46/42.57, upper arm 2.71/2.55, forearm
      1.62/1.38, hand 0.61/0.56, thigh 14.16/14.78, shank 4.33/4.81, foot 1.37/1.29.
    url: https://doi.org/10.1016/0021-9290(95)00178-6
    accessed: 2026-11-13
  expert:
    cite: >-
      Expert estimate (ATROX P056): typical gym loads for a lifter whose anchor lift is known, cross-checked with the
      implied-load table in docs/CEKIRDEK-HAREKETLER.md. To be replaced by app data (docs/03-ML-MODEL.md §12).

