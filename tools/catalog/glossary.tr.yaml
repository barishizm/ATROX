# ATROX Turkish exercise glossary (P026).
#
# Mandatory terminology for the LLM translation pass: when an English exercise name contains one of a term's
# `en` patterns, the Turkish name MUST contain `tr` (case-insensitive). `tr == en` means "leave as is" — this is how
# Turkish gyms actually say it.
#
# STATUS: approved by the product owner (crunch, cable, machine, band, front/rear/side kept in English).
approved: true
version: 1

# name terms: matched against the exercise name, hyphen/plural-insensitive, lowercase.
terms:
  # --- Terms Turkish gyms translate ---
  - {en: [pull-up, pullup, pull up, chin-up, chin up, chinup], tr: barfiks, note: "pull-up and chin-up both say barfiks"}
  - {en: [push-up, pushup, push up], tr: şınav}
  - {en: [sit-up, situp, sit up], tr: mekik}
  - {en: [crunch], tr: crunch, note: "kept; alias 'mekik'"}
  - {en: [squat], tr: squat, note: "kept; 'çömelme' is not used in gyms"}
  - {en: [lunge], tr: lunge, note: "kept; alias 'hamle'"}
  - {en: [deadlift], tr: deadlift, note: "kept; alias 'ölü kaldırış'"}
  - {en: [calf raise], tr: baldır, note: "e.g. Standing Calf Raise → Ayakta Baldır Kaldırma"}
  - {en: [shrug], tr: omuz silkme}
  - {en: [dip], tr: dips, note: "kept as 'dips'"}
  - {en: [plank], tr: plank}
  - {en: [stretch], tr: esneme}
  - {en: [curl], tr: curl, note: "kept: 'biceps curl', 'hammer curl'; alias 'bükme'"}
  - {en: [raise], tr: kaldırma, note: "lateral raise → yana açış is common; use 'Lateral Raise' as 'Yana Açış'"}
  - {en: [lateral raise], tr: yana açış}
  - {en: [fly, flye, flyes], tr: fly, note: "kept"}
  - {en: [extension], tr: extension, note: "kept: 'triceps extension', 'leg extension'"}
  - {en: [kickback], tr: kickback, note: "kept"}
  - {en: [pullover], tr: pullover, note: "kept"}
  - {en: [good morning], tr: good morning, note: "kept"}
  - {en: [hyperextension, back extension], tr: sırt extension}
  - {en: [jump], tr: sıçrama}
  - {en: [walk], tr: yürüyüş}
  - {en: [twist], tr: twist, note: "kept; alias 'burkma'"}
  - {en: [bridge], tr: köprü, note: "glute bridge → Kalça Köprüsü"}
  - {en: [hip thrust], tr: hip thrust}
  - {en: [step-up, step up], tr: step-up}

  # --- Terms kept in English in Turkish gyms ---
  - {en: [bench press], tr: bench press, note: "never translated"}
  - {en: [overhead press, military press], tr: overhead press, note: "military press alias 'asker presi' not used"}
  - {en: [shoulder press], tr: shoulder press}
  - {en: [press], tr: press, note: "kept"}
  - {en: [row], tr: row, note: "kept: 'barbell row', 'cable row'; alias 'kürek çekiş'"}
  - {en: [lat pulldown, pulldown], tr: lat pulldown}
  - {en: [pushdown], tr: pushdown, note: "triceps pushdown"}
  - {en: [leg press], tr: leg press}
  - {en: [leg curl], tr: leg curl}
  - {en: [leg extension], tr: leg extension}
  - {en: [smith machine, smith], tr: smith machine, note: "kept"}
  - {en: [cable crossover, crossover], tr: cable crossover}
  - {en: [preacher], tr: preacher}
  - {en: [hack squat], tr: hack squat}
  - {en: [skull crusher, skullcrusher], tr: skull crusher}
  - {en: [face pull], tr: face pull}
  - {en: [clean], tr: clean, note: "Olympic lift, kept"}
  - {en: [snatch], tr: snatch, note: "Olympic lift, kept"}
  - {en: [jerk], tr: jerk, note: "Olympic lift, kept"}
  - {en: [kettlebell], tr: kettlebell}
  - {en: [dumbbell], tr: dumbbell, note: "'dambıl' used as alias only"}
  - {en: [barbell], tr: barbell, note: "'halter' used as alias only"}
  - {en: [ez-bar, ez bar, ez curl, ez], tr: ez bar}
  - {en: [cable], tr: cable, note: "kept"}
  - {en: [machine], tr: machine, note: "kept"}
  - {en: [band, bands, resistance band], tr: band, note: "kept; alias 'lastik'"}
  - {en: [foam roll, foam roller], tr: foam roller}
  - {en: [medicine ball], tr: medicine ball}
  - {en: [smr], tr: foam roller, note: "self-myofascial release"}

  # --- Directional / positional modifiers ---
  - {en: [incline], tr: incline}
  - {en: [decline], tr: decline}
  - {en: [seated], tr: oturarak}
  - {en: [standing], tr: ayakta}
  - {en: [lying], tr: yatarak}
  - {en: [kneeling], tr: diz üstü}
  - {en: [reverse], tr: ters}
  - {en: [front], tr: front, note: "kept"}
  - {en: [rear], tr: rear, note: "kept"}
  - {en: [side], tr: side, note: "kept"}
  - {en: [alternating, alternate], tr: sırayla}
  - {en: [wide grip, wide-grip], tr: geniş tutuş}
  - {en: [close grip, close-grip], tr: dar tutuş}
  - {en: [overhead], tr: baş üstü}
  - {en: [single-arm, one arm, one-arm], tr: tek kol}
  - {en: [single-leg, one leg, one-leg], tr: tek bacak}

# Instruction-level wording (applies to instructions text, kept consistent across exercises).
instruction_terms:
  - {en: "starting position", tr: "başlangıç pozisyonu"}
  - {en: "repetitions", tr: "tekrar"}
  - {en: "rep", tr: "tekrar"}
  - {en: "set", tr: "set"}
  - {en: "barbell", tr: "halter"}
  - {en: "dumbbell", tr: "dambıl"}
  - {en: "torso", tr: "gövde"}
  - {en: "core", tr: "core (karın-bel bölgesi)"}
  - {en: "grip", tr: "tutuş"}
  - {en: "exhale", tr: "nefes ver"}
  - {en: "inhale", tr: "nefes al"}
