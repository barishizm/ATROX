name: iOS

# PRs only: a push to main re-ran the exact same checks as the PR just merged.
# Run it by hand (workflow_dispatch) when a main check is wanted.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Cancel superseded runs of the same ref.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIMULATOR_NAME: iPhone 17

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        # Not --strict: 54 pre-existing warnings are deferred (docs/ILERLEME.md). Errors fail the job.
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ios/Packages/*/.build
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Packages/*/Package.swift', 'ios/Packages/*/Package.resolved', 'ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets.xcconfig is gitignored; Base.xcconfig includes it optionally.
      # CI never has real keys, so fall back to the checked-in example.
      - name: Provide Secrets.xcconfig
        run: |
          if [ ! -f ios/Config/Secrets.xcconfig ]; then
            cp ios/Config/Secrets.example.xcconfig ios/Config/Secrets.xcconfig
          fi

      - name: Package tests
        run: |
          set -euo pipefail
          # StrengthKit is tested on Linux by core.yml; no need to run it again here.
          for pkg in DataKit CoachKit; do
            echo "::group::swift test $pkg"
            swift test --package-path "ios/Packages/$pkg"
            echo "::endgroup::"
          done

      # DesignSystem ships a String Catalog (.xcstrings). `swift test` does not compile
      # catalogs on the runner's toolchain, so its localization tests fail there; xcodebuild does.
      - name: DesignSystem tests (iPhone simulator)
        working-directory: ios/Packages/DesignSystem
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme DesignSystem \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Build once, then run the fast unit tests before the slow UI tests so a unit failure
      # stops the job early. One simulator, no parallel testing (UI tests are timing-sensitive).
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ios/ATROX.xcodeproj \
            -scheme ATROX \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipPackagePluginValidation

      - name: App unit tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ios/ATROX.xcodeproj \
            -scheme ATROX \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ATROXTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Unit.xcresult"

      - name: App UI tests
        # A UI test that fails once is re-run once before the job fails.
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ios/ATROX.xcodeproj \
            -scheme ATROX \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ATROXUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/UI.xcresult"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: |
            ${{ runner.temp }}/Unit.xcresult
            ${{ runner.temp }}/UI.xcresult
          retention-days: 7
