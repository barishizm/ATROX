included:
  - ios

excluded:
  - ios/**/.build
  - ios/**/DerivedData
  - "**/*.generated.swift"
  - ios/Packages/DesignSystem/Sources/DesignSystem/Components/MuscleMap/MuscleMapData.swift # generated by tools/musclemap

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_comma   # swiftformat yönetir

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
  excluded: [id, x, y, i, j, kg, cm, lb]

type_name:
  min_length: 2

cyclomatic_complexity:
  warning: 12
  error: 25

analyzer_rules:
  - unused_import
